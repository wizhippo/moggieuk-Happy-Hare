# Custom Happy Hare macros for a cutter that sits upstream of the extruder
# entry sensor and extruder gears.
#
# Include this file after Happy Hare's base config, then set:
#   form_tip_macro: _MMU_CUT_TIP_PRE_SENSOR
#   force_form_tip_standalone: 1
#   gcode_load_sequence: 1
#   load_sequence_macro: _MMU_LOAD_SEQUENCE_PRE_SENSOR_CUTTER
#   gcode_unload_sequence: 1
#   unload_sequence_macro: _MMU_UNLOAD_SEQUENCE_PRE_SENSOR_CUTTER
#
# Design:
# - The cut macro retracts just enough to allow the downstream fragment tail to
#   be parked at the extruder gear entrance after the cut.
# - A split-rip is used to help free the blade after the cut:
#   downstream fragment moves toward the nozzle with the extruder, while the
#   upstream MMU-side filament is then moved away from the blade with the gear.
#   This is implemented sequentially because Happy Hare does not expose a safe
#   opposite-direction simultaneous move primitive for independent gear and
#   extruder motion.
# - The upstream MMU-side filament is then homed to the entry sensor with the
#   gear motor and aligned to the extruder gear entrance.
# - The custom unload macro starts from that calibrated upstream position.
# - The custom load macro re-homes the upstream filament to the entry sensor,
#   aligns it to the extruder gear entrance, and then declares the tool loaded
#   because the downstream fragment is already parked from entrance to nozzle.
#
# Worked example with the defaults below and rip_length=1:
# - nozzle = 0
# - extruder gear entrance = 80
# - entry sensor = 96
# - physical cutter = 123
# - pre-cut retract = 43
#
# Filament state walkthrough:
# - Before the cut sequence starts, filament is continuous from the nozzle,
#   through the extruder, and past the cutter.
# - After the 43mm pre-cut retract but before the cut, the connected filament
#   tip has been pulled back to 43mm from the nozzle. The filament crossing the
#   cutter at 123mm will become the tail of the parked downstream fragment.
# - After the cut, split-rip, and downstream entrance-park move, the
#   downstream fragment spans nozzle-to-entrance:
#     0mm nozzle tip -> 80mm tail at extruder gear entrance
#   This fragment is 80mm long and is the filament intentionally left in the
#   extruder/toolhead path.
# - At the same point, the disconnected upstream MMU-side filament is homed to
#   the entry sensor and then advanced to the same 80mm entrance reference, so
#   both sides are aligned at the extruder gear entrance.
# - After unload, only the upstream MMU-side filament is removed. The parked
#   downstream fragment remains in place from 0mm to 80mm.
# - After the next load, the new upstream filament is again aligned to the
#   80mm entrance and contacts the parked downstream fragment. The tool is
#   declared loaded because the nozzle path is already occupied, but the nozzle
#   still contains the previously parked filament.
#
# Purge expectation from that example:
# - The first extrusion after load does not immediately put new filament at the
#   nozzle. It first pushes the parked 80mm downstream fragment forward.
# - Any purge or transition tuning later in the toolchange flow should assume
#   the nozzle starts full of the previously parked filament plus the normal
#   melt-zone mix, not fresh filament from the newly loaded upstream side.

[gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS]
description: Extra variables for a cutter before the extruder entry sensor
gcode: # Leave empty

# Real distance from nozzle to the physical cutter.
variable_physical_blade_pos     : 123.0

# Initial retract before the physical cut.
# For the entrance-park model this must be at least:
#   physical_blade_pos - gear_entry_pos
# With the defaults below this is 43.0mm.
variable_retract_length         : 43.0

# Distance from nozzle to the extruder gear entrance. Normally this matches
# 'toolhead_extruder_to_nozzle' in mmu_parameters.cfg.
variable_gear_entry_pos         : 80.0

# Distance from the extruder entry sensor to the extruder gear entrance.
# Normally this matches 'toolhead_entry_to_extruder' in mmu_parameters.cfg.
variable_entry_to_extruder      : 16.0

# Extra travel margin for sensor homing moves.
variable_entry_homing_margin    : 5.0

[gcode_macro _MMU_CUT_TIP_PRE_SENSOR]
description: Cut filament with a physical cutter before the entry sensor and park the downstream fragment at the extruder gear entrance

# -------------------------- Internal Don't Touch -------------------------
variable_output_park_pos: 0 # Dynamically set in this macro

gcode:
    {% set final_eject = params.FINAL_EJECT|default(0)|int %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set custom = printer['gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS'] %}
    {% set park_vars = printer['gcode_macro _MMU_PARK'] %}
    {% set pin_loc_x, pin_loc_y = vars.pin_loc_xy|map('float') %}
    {% set pin_park_dist = vars['pin_park_dist']|float %}
    {% set retract_length = custom['retract_length']|float %}
    {% set simple_tip_forming = vars['simple_tip_forming']|default(true)|lower == 'true' %}
    {% set physical_blade_pos = custom['physical_blade_pos']|float %}
    {% set gear_entry_pos = custom['gear_entry_pos']|float %}
    {% set entry_to_extruder = custom['entry_to_extruder']|float %}
    {% set entry_homing_margin = custom['entry_homing_margin']|float %}
    {% set entry_sensor_pos = gear_entry_pos + entry_to_extruder %}
    {% set rip_length = vars['rip_length']|float %}
    {% set extruder_move_speed = vars['extruder_move_speed']|float %}
    {% set travel_speed = vars['travel_speed']|float %}
    {% set restore_position = vars['restore_position']|default(true)|lower == 'true' %}
    {% set cutting_axis = vars['cutting_axis'] %}
    {% set downstream_forward_to_entrance = physical_blade_pos - gear_entry_pos %}
    {% set downstream_park_after_rip = downstream_forward_to_entrance - rip_length %}
    {% set upstream_home_to_sensor = physical_blade_pos + rip_length - entry_sensor_pos + entry_homing_margin %}

    {% if cutting_axis == "x" %}
        {% set pin_park_x_loc = pin_loc_x + pin_park_dist %}
        {% set pin_park_y_loc = pin_loc_y %}
    {% else %}
        {% set pin_park_y_loc = pin_loc_y + pin_park_dist %}
        {% set pin_park_x_loc = pin_loc_x %}
    {% endif %}

    {% if "xy" not in printer.toolhead.homed_axes %}
        MMU_LOG MSG="Automatically homing XY"
        G28 X Y
        _CUT_TIP_MOVE_IN_BOUNDS
    {% endif %}

    SAVE_GCODE_STATE NAME=_MMU_CUT_TIP_PRE_SENSOR_state

    G90
    M83
    G92 E0

    {% if retract_length >= physical_blade_pos %}
        {action_raise_error("Configured retract_length must stay below physical_blade_pos for _MMU_CUT_TIP_PRE_SENSOR")}
    {% endif %}
    {% if gear_entry_pos <= 0 or entry_to_extruder <= 0 or physical_blade_pos <= entry_sensor_pos %}
        {action_raise_error("Invalid pre-sensor cutter geometry. Expected physical_blade_pos > gear_entry_pos + entry_to_extruder")}
    {% endif %}
    {% if retract_length < downstream_forward_to_entrance %}
        {action_raise_error("Configured retract_length is too short for entrance-park model. It must be at least physical_blade_pos - gear_entry_pos")}
    {% endif %}

    # Step 1 - Retract the downstream toolhead filament before the physical cut.
    {% set effective_retract_length = retract_length - printer.mmu.extruder_filament_remaining - park_vars.retracted_length %}
    {% if effective_retract_length > 0 %}
        MMU_LOG MSG="Retracting downstream filament {effective_retract_length|round(1)}mm prior to pre-sensor cut"
        G1 E-{effective_retract_length} F{extruder_move_speed * 60}
        {% if simple_tip_forming %}
            G1 E{effective_retract_length / 2} F{extruder_move_speed * 60}
            G1 E-{effective_retract_length / 2} F{extruder_move_speed * 60}
        {% endif %}
    {% endif %}

    # Step 2 - Perform the physical cut motion.
    _CUT_TIP_ADJUST_CURRENT
    _CUT_TIP_MOVE_TO_CUTTER_PIN PIN_PARK_X_LOC={pin_park_x_loc} PIN_PARK_Y_LOC={pin_park_y_loc}
    _CUT_TIP_GANTRY_SERVO_DOWN
    _CUT_TIP_DO_CUT_MOTION_PRE_SENSOR PIN_PARK_X_LOC={pin_park_x_loc} PIN_PARK_Y_LOC={pin_park_y_loc}
    _CUT_TIP_GANTRY_SERVO_UP
    _CUT_TIP_RESTORE_CURRENT
    _MMU_EVENT EVENT="filament_cut"

    # Step 3 - Park the downstream fragment tail at the extruder gear entrance
    # and validate that the entry sensor is now clear.
    {% if downstream_park_after_rip > 0 %}
        MMU_LOG MSG="Parking downstream fragment tail at extruder gear entrance with extruder only"
        _MMU_STEP_MOVE MOVE={downstream_park_after_rip} MOTOR=extruder SPEED={extruder_move_speed}
    {% endif %}
    {% if printer.mmu.sensors.extruder is not sameas false %}
        {action_raise_error("Downstream fragment did not clear the extruder entry sensor after entrance parking")}
    {% endif %}

    # Step 4 - Calibrate the upstream MMU-side filament.
    # The entry sensor is now clear, so we can home the disconnected upstream
    # piece to that sensor with gear only and then align it to the same gear
    # entrance reference point.
    MMU_LOG MSG="Homing upstream MMU-side filament to entry sensor with gear only"
    _MMU_STEP_HOMING_MOVE MOVE={upstream_home_to_sensor} MOTOR=gear ENDSTOP=extruder
    MMU_LOG MSG="Aligning upstream MMU-side filament to extruder gear entrance"
    _MMU_STEP_MOVE MOVE={entry_to_extruder} MOTOR=gear SPEED={extruder_move_speed}

    {% if final_eject %}
        G92 E0
        G1 E-80 F{extruder_move_speed * 60}
    {% endif %}

    # The downstream fragment tail is parked at the extruder gear entrance.
    SET_GCODE_VARIABLE MACRO=_MMU_CUT_TIP_PRE_SENSOR VARIABLE=output_park_pos VALUE={gear_entry_pos}

    RESTORE_GCODE_STATE NAME=_MMU_CUT_TIP_PRE_SENSOR_state MOVE={1 if restore_position else 0} MOVE_SPEED={travel_speed}


[gcode_macro _MMU_UNLOAD_SEQUENCE_PRE_SENSOR_CUTTER]
description: Unload sequence for a cutter before the extruder entry sensor
gcode:
    {% set filament_pos = params.FILAMENT_POS|int %}
    {% set length = params.LENGTH|float %}
    {% set extruder_only = params.EXTRUDER_ONLY|int %}
    {% set park_pos = params.PARK_POS|float %}

    {% if extruder_only %}
        _MMU_STEP_UNLOAD_TOOLHEAD EXTRUDER_ONLY=1 PARK_POS={park_pos}
    {% elif filament_pos == 0 %}
        {action_raise_error("Can't unload - already unloaded!")}
    {% else %}
        {% if filament_pos >= 7 %}
            # The cut macro already parked the upstream MMU-side filament at the
            # extruder gear entrance, so we can unload directly from there.
            _MMU_STEP_UNLOAD_BOWDEN LENGTH={length}
            _MMU_STEP_UNLOAD_GATE
        {% elif filament_pos >= 4 %}
            _MMU_STEP_UNLOAD_BOWDEN LENGTH={length}
            _MMU_STEP_UNLOAD_GATE
        {% elif filament_pos >= 2 %}
            _MMU_STEP_UNLOAD_GATE FULL=1
        {% endif %}
    {% endif %}


[gcode_macro _CUT_TIP_DO_CUT_MOTION_PRE_SENSOR]
description: Helper to do a single cut movement for a cutter before the entry sensor
gcode:
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC | float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC | float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set cutting_axis = vars['cutting_axis'] %}

    {% set pin_loc = vars['pin_loc_compressed']|default(-999)|float %}
    {% if pin_loc != -999 %}
        {% if cutting_axis == "x" %}
            {% set pin_loc_compressed_x = pin_loc %}
            {% set pin_loc_compressed_y = pin_park_y_loc %}
        {% else %}
            {% set pin_loc_compressed_x = pin_park_x_loc %}
            {% set pin_loc_compressed_y = pin_loc %}
        {% endif %}
    {% else %}
        {% set pin_loc_compressed_x, pin_loc_compressed_y = vars.pin_loc_compressed_xy|map('float') %}
    {% endif %}

    {% set cut_fast_move_fraction = vars['cut_fast_move_fraction']|float %}
    {% set cut_fast_move_speed = vars['cut_fast_move_speed']|float %}
    {% set cut_slow_move_speed = vars['cut_slow_move_speed']|float %}
    {% set cut_dwell_time = vars['cut_dwell_time']|float %}
    {% set evacuate_speed = vars['evacuate_speed']|float %}
    {% set rip_length = vars['rip_length']|float %}
    {% set rip_speed = vars['rip_speed']|float %}

    {% set fast_slow_transition_loc_x = (pin_loc_compressed_x - pin_park_x_loc) * cut_fast_move_fraction + pin_park_x_loc|float %}
    {% set fast_slow_transition_loc_y = (pin_loc_compressed_y - pin_park_y_loc) * cut_fast_move_fraction + pin_park_y_loc|float %}
    G1 X{fast_slow_transition_loc_x} Y{fast_slow_transition_loc_y} F{cut_fast_move_speed * 60}
    G1 X{pin_loc_compressed_x} Y{pin_loc_compressed_y} F{cut_slow_move_speed * 60}
    G4 P{cut_dwell_time}

    # Perform the pre-sensor split-rip while the blade is still engaged.
    # This mirrors the stock timing, but uses separate motors in sequence
    # because Happy Hare does not expose an opposite-direction simultaneous
    # primitive for independent gear and extruder motion.
    {% if rip_length > 0 %}
        MMU_LOG MSG="Ripping downstream fragment toward nozzle by {rip_length|round(1)}mm with extruder only"
        _MMU_STEP_MOVE MOVE={rip_length} MOTOR=extruder SPEED={rip_speed}
        MMU_LOG MSG="Ripping upstream MMU-side filament away from blade by {rip_length|round(1)}mm with gear only"
        _MMU_STEP_MOVE MOVE=-{rip_length} MOTOR=gear SPEED={rip_speed}
    {% endif %}

    G1 X{pin_park_x_loc} Y{pin_park_y_loc} F{evacuate_speed * 60}


[gcode_macro _MMU_LOAD_SEQUENCE_PRE_SENSOR_CUTTER]
description: Load sequence for a cutter before the extruder entry sensor
gcode:
    {% set filament_pos = params.FILAMENT_POS|int %}
    {% set length = params.LENGTH|float %}
    {% set full = params.FULL|int %}
    {% set home_extruder = params.HOME_EXTRUDER|int %}
    {% set skip_extruder = params.SKIP_EXTRUDER|int %}
    {% set extruder_only = params.EXTRUDER_ONLY|int %}

    {% if extruder_only %}
        _MMU_STEP_HOME_EXTRUDER
        _MMU_STEP_SET_FILAMENT STATE=10	# FILAMENT_POS_LOADED
    {% else %}
        {% if filament_pos <= 0 %}
            _MMU_STEP_LOAD_GATE
        {% endif %}

        {% if filament_pos < 4 %}
            _MMU_STEP_LOAD_BOWDEN LENGTH={length}
        {% endif %}

        {% if full and not skip_extruder and not home_extruder %}
            {action_raise_error("_MMU_LOAD_SEQUENCE_PRE_SENSOR_CUTTER requires entry-sensor homing for the final toolhead handoff")}
        {% endif %}

        {% if full and not skip_extruder and home_extruder %}
            # Re-home to the entry sensor and align to the gear entrance where
            # the parked downstream fragment begins. At this point the toolhead
            # path from entrance to nozzle is already occupied, so we can mark
            # the tool loaded without an additional toolhead move.
            _MMU_STEP_HOME_EXTRUDER
            _MMU_STEP_SET_FILAMENT STATE=10	# FILAMENT_POS_LOADED
        {% endif %}
    {% endif %}
