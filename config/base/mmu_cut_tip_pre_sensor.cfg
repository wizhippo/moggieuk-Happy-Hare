# Custom Happy Hare macros for a cutter that sits upstream of the extruder
# entry sensor and extruder gears.
#
# Include this file after Happy Hare's base config, then set:
#   form_tip_macro: _MMU_CUT_TIP_PRE_SENSOR
#   force_form_tip_standalone: 1
#   gcode_load_sequence: 1
#   load_sequence_macro: _MMU_LOAD_SEQUENCE_PRE_SENSOR_CUTTER
#   gcode_unload_sequence: 1
#   unload_sequence_macro: _MMU_UNLOAD_SEQUENCE_PRE_SENSOR_CUTTER

[gcode_macro _MMU_PRE_SENSOR_STATE]
description: State tracking for pre-sensor cutter parked slug model
variable_has_parked_slug: 0
gcode:
    MMU_LOG MSG="Pre-sensor cutter state: has_parked_slug={printer['gcode_macro _MMU_PRE_SENSOR_STATE'].has_parked_slug|int}"


[delayed_gcode _MMU_PRE_SENSOR_INIT]
initial_duration: 1
gcode:
    SET_GCODE_VARIABLE MACRO=_MMU_PRE_SENSOR_STATE VARIABLE=has_parked_slug VALUE=0


[gcode_macro _MMU_PRE_SENSOR_ASSERT_CLEAR]
description: Fail if the extruder entry sensor is still triggered after pre-sensor cutter moves
gcode:
    {% set custom = printer['gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS'] %}
    {% set debug = custom['debug']|int %}
    {% set extruder_sensor = printer.mmu.sensors.extruder|default(none) %}

    M400

    {% if extruder_sensor is not none and extruder_sensor %}
        {action_raise_error("Entry sensor still triggered after cut-tip clear sequence")}
    {% elif debug %}
        MMU_LOG MSG="DEBUG sensor: entry sensor clear after pre-sensor cutter sequence"
    {% endif %}


[gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS]
description: Extra variables for a cutter before the extruder entry sensor
gcode: # Leave empty

# Current measured geometry:
#   cutter -> sensor        = 16mm
#   sensor -> gear entrance = 10mm
#   gear entrance -> nozzle = 82mm
variable_physical_blade_pos     : 108.0
variable_retract_length         : 26.0
variable_gear_entry_pos         : 82.0
variable_entry_to_extruder      : 10.0
# Extra distance to push the MMU-side cut tip past the extruder entry sensor.
variable_sensor_clearance       : 5.0
variable_slug_load_speed        : 5.0
variable_cut_z_height           : 195.0
variable_debug                  : 1


[gcode_macro _MMU_CUT_TIP_PRE_SENSOR]
description: Cut filament with a physical cutter before the entry sensor and park the downstream fragment

variable_output_park_pos: 0

gcode:
    {% set final_eject = params.FINAL_EJECT|default(0)|int %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set custom = printer['gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS'] %}
    {% set park_vars = printer['gcode_macro _MMU_PARK'] %}

    {% set debug = custom['debug']|int %}
    {% set pin_loc_x, pin_loc_y = vars.pin_loc_xy|map('float') %}
    {% set pin_park_dist = vars['pin_park_dist']|float %}
    {% set retract_length = custom['retract_length']|float %}
    {% set physical_blade_pos = custom['physical_blade_pos']|float %}
    {% set gear_entry_pos = custom['gear_entry_pos']|float %}
    {% set entry_to_extruder = custom['entry_to_extruder']|float %}
    {% set sensor_clearance = custom['sensor_clearance']|float %}
    {% set cut_z_height = custom['cut_z_height']|float %}
    {% set z_min = printer.toolhead.axis_minimum.z|float %}
    {% set z_max = printer.toolhead.axis_maximum.z|float %}

    {% set simple_tip_forming = vars['simple_tip_forming']|default(true)|lower == 'true' %}
    {% set entry_sensor_pos = gear_entry_pos + entry_to_extruder %}
    {% set rip_length = vars['rip_length']|float %}
    {% set extruder_move_speed = vars['extruder_move_speed']|float %}
    {% set travel_speed = vars['travel_speed']|float %}
    {% set restore_position = vars['restore_position']|default(true)|lower == 'true' %}
    {% set cutting_axis = vars['cutting_axis'] %}

    {% set downstream_forward_to_entrance = physical_blade_pos - gear_entry_pos %}
    {% set downstream_park_after_rip = downstream_forward_to_entrance - rip_length %}
    {% set sensor_clear_move = physical_blade_pos - entry_sensor_pos + sensor_clearance %}
    {% set downstream_temp_park_pos = gear_entry_pos - sensor_clear_move %}
    {% set upstream_temp_park_pos = physical_blade_pos + rip_length - sensor_clear_move %}
    {% set upstream_return_to_cutter = rip_length - sensor_clear_move %}
    {% set upstream_cut_pos_after_rip = physical_blade_pos + rip_length %}

    {% if cutting_axis == "x" %}
        {% set pin_park_x_loc = pin_loc_x + pin_park_dist if pin_loc_x != -999 else -999 %}
        {% set pin_park_y_loc = pin_loc_y %}
    {% else %}
        {% set pin_park_y_loc = pin_loc_y + pin_park_dist if pin_loc_y != -999 else -999 %}
        {% set pin_park_x_loc = pin_loc_x %}
    {% endif %}

    {% if debug %}
        MMU_LOG MSG="DEBUG cut vars: blade={physical_blade_pos}, gear_entry={gear_entry_pos}, entry_sensor={entry_sensor_pos}, retract={retract_length}, rip={rip_length}, sensor_clearance={sensor_clearance}, hh_output_park_pos={downstream_temp_park_pos}, upstream_cut_pos_after_rip={upstream_cut_pos_after_rip}, upstream_temp_park_pos={upstream_temp_park_pos}, downstream_park_after_rip={downstream_park_after_rip}, sensor_clear_move={sensor_clear_move}, downstream_temp_park_pos={downstream_temp_park_pos}"
        MMU_LOG MSG="DEBUG cut XY: pin_loc_x={pin_loc_x}, pin_loc_y={pin_loc_y}, pin_park_x={pin_park_x_loc}, pin_park_y={pin_park_y_loc}, cutting_axis={cutting_axis}"
    {% endif %}

    {% if retract_length >= physical_blade_pos %}
        {action_raise_error("Configured retract_length must stay below physical_blade_pos for _MMU_CUT_TIP_PRE_SENSOR")}
    {% endif %}
    {% if gear_entry_pos <= 0 or entry_to_extruder <= 0 or sensor_clearance < 0 or physical_blade_pos <= entry_sensor_pos %}
        {action_raise_error("Invalid pre-sensor cutter geometry. Expected physical_blade_pos > gear_entry_pos + entry_to_extruder")}
    {% endif %}
    {% if downstream_temp_park_pos <= 0 %}
        {action_raise_error("Invalid pre-sensor cutter geometry. blade-to-sensor clear move must stay below gear_entry_pos")}
    {% endif %}
    {% if retract_length < downstream_forward_to_entrance %}
        {action_raise_error("Configured retract_length is too short. It must be at least physical_blade_pos - gear_entry_pos")}
    {% endif %}
    {% if cut_z_height < z_min or cut_z_height > z_max %}
        {action_raise_error("Configured cut_z_height is outside the printer Z travel range")}
    {% endif %}

    {% if "xy" not in printer.toolhead.homed_axes %}
        MMU_LOG MSG="Automatically homing XY"
        G28 X Y
    {% endif %}

    {% if "z" not in printer.toolhead.homed_axes %}
        MMU_LOG MSG="Automatically homing Z before cutter move"
        G28 Z
    {% endif %}

    SAVE_GCODE_STATE NAME=_MMU_CUT_TIP_PRE_SENSOR_state

    G90
    M83
    G92 E0

    MMU_LOG MSG="Moving XY to cutter park/clear position before raising Z"
    _MMU_CUT_TIP_SAFE_XY_MOVE X={pin_park_x_loc} Y={pin_park_y_loc} SPEED={travel_speed}

    MMU_LOG MSG="Moving to cutter Z height: {cut_z_height|round(1)}"
    G1 Z{cut_z_height} F{travel_speed * 60}

    {% set effective_retract_length = retract_length - park_vars.retracted_length %}

    {% if debug %}
        MMU_LOG MSG="DEBUG pre-cut retract: retract_length={retract_length}, prior_park_retract={park_vars.retracted_length}, effective={effective_retract_length}"
    {% endif %}

    {% if effective_retract_length < 0 %}
        MMU_LOG MSG="Warning: prior park retract exceeds configured retract_length by {(-effective_retract_length)|round(1)}mm; continuing cut without compensation" ERROR=1
    {% endif %}

    {% if effective_retract_length > 0 %}
        MMU_LOG MSG="Retracting downstream filament {effective_retract_length|round(1)}mm prior to pre-sensor cut"
        G1 E-{effective_retract_length} F{extruder_move_speed * 60}
        {% if simple_tip_forming %}
            G1 E{effective_retract_length / 2} F{extruder_move_speed * 60}
            G1 E-{effective_retract_length / 2} F{extruder_move_speed * 60}
        {% endif %}
    {% endif %}

    _CUT_TIP_ADJUST_CURRENT
    _CUT_TIP_GANTRY_SERVO_DOWN
    _CUT_TIP_DO_CUT_MOTION_PRE_SENSOR PIN_PARK_X_LOC={pin_park_x_loc} PIN_PARK_Y_LOC={pin_park_y_loc}
    _CUT_TIP_GANTRY_SERVO_UP
    _CUT_TIP_RESTORE_CURRENT
    _MMU_EVENT EVENT="filament_cut"

    {% if downstream_park_after_rip > 0 %}
        MMU_LOG MSG="Parking downstream fragment tail at extruder gear entrance with extruder only"
        _MMU_STEP_MOVE MOVE={downstream_park_after_rip} MOTOR=extruder SPEED={extruder_move_speed}
    {% endif %}

    {% if sensor_clear_move > 0 %}
        MMU_LOG MSG="Advancing cut tip {sensor_clear_move|round(1)}mm past extruder sensor with synchronized gear+extruder"
        _MMU_STEP_MOVE MOVE={sensor_clear_move} MOTOR=gear+extruder SPEED={extruder_move_speed}

        MMU_LOG MSG="Positioning MMU-side cut tip back at cutter with gear only: {upstream_return_to_cutter|round(1)}mm"
        _MMU_STEP_MOVE MOVE={upstream_return_to_cutter} MOTOR=gear SPEED={extruder_move_speed}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_MMU_CUT_TIP_PRE_SENSOR VARIABLE=output_park_pos VALUE={downstream_temp_park_pos}
    SET_GCODE_VARIABLE MACRO=_MMU_PRE_SENSOR_STATE VARIABLE=has_parked_slug VALUE=1

    {% if debug %}
        MMU_LOG MSG="DEBUG cut complete: hh_output_park_pos={downstream_temp_park_pos}, upstream_cut_pos_after_rip={upstream_cut_pos_after_rip}, upstream_back_at_cutter={physical_blade_pos}, downstream_park_pos={downstream_temp_park_pos}, sensor_clear_move={sensor_clear_move}, has_parked_slug=1"
    {% endif %}

    {% if final_eject %}
        G92 E0
        G1 E-{downstream_temp_park_pos} F{extruder_move_speed * 60}
        SET_GCODE_VARIABLE MACRO=_MMU_PRE_SENSOR_STATE VARIABLE=has_parked_slug VALUE=0
    {% endif %}

    RESTORE_GCODE_STATE NAME=_MMU_CUT_TIP_PRE_SENSOR_state MOVE={1 if restore_position else 0} MOVE_SPEED={travel_speed}
    _MMU_PRE_SENSOR_ASSERT_CLEAR


[gcode_macro _CUT_TIP_DO_CUT_MOTION_PRE_SENSOR]
description: Helper to do a single cut movement for a cutter before the entry sensor
gcode:
    {% set pin_park_x_loc = params.PIN_PARK_X_LOC|float %}
    {% set pin_park_y_loc = params.PIN_PARK_Y_LOC|float %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}
    {% set custom = printer['gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS'] %}
    {% set debug = custom['debug']|int %}
    {% set cutting_axis = vars['cutting_axis'] %}

    {% set pin_loc = vars['pin_loc_compressed']|default(-999)|float %}

    {% if pin_loc != -999 %}
        {% if cutting_axis == "x" %}
            {% set pin_loc_compressed_x = pin_loc %}
            {% set pin_loc_compressed_y = pin_park_y_loc %}
        {% else %}
            {% set pin_loc_compressed_x = pin_park_x_loc %}
            {% set pin_loc_compressed_y = pin_loc %}
        {% endif %}
    {% else %}
        {% set pin_loc_compressed_x, pin_loc_compressed_y = vars.pin_loc_compressed_xy|map('float') %}
    {% endif %}

    {% set cut_fast_move_fraction = vars['cut_fast_move_fraction']|float %}
    {% set cut_fast_move_speed = vars['cut_fast_move_speed']|float %}
    {% set cut_slow_move_speed = vars['cut_slow_move_speed']|float %}
    {% set cut_dwell_time = vars['cut_dwell_time']|float %}
    {% set evacuate_speed = vars['evacuate_speed']|float %}
    {% set rip_length = vars['rip_length']|float %}
    {% set rip_speed = vars['rip_speed']|float %}

    {% set fast_slow_transition_loc_x = (pin_loc_compressed_x - pin_park_x_loc) * cut_fast_move_fraction + pin_park_x_loc if pin_loc_compressed_x != -999 and pin_park_x_loc != -999 else -999 %}
    {% set fast_slow_transition_loc_y = (pin_loc_compressed_y - pin_park_y_loc) * cut_fast_move_fraction + pin_park_y_loc if pin_loc_compressed_y != -999 and pin_park_y_loc != -999 else -999 %}

    {% if debug %}
        MMU_LOG MSG="DEBUG cut motion: transition_x={fast_slow_transition_loc_x}, transition_y={fast_slow_transition_loc_y}, compressed_x={pin_loc_compressed_x}, compressed_y={pin_loc_compressed_y}"
    {% endif %}

    _MMU_CUT_TIP_SAFE_XY_MOVE X={fast_slow_transition_loc_x} Y={fast_slow_transition_loc_y} SPEED={cut_fast_move_speed}
    _MMU_CUT_TIP_SAFE_XY_MOVE X={pin_loc_compressed_x} Y={pin_loc_compressed_y} SPEED={cut_slow_move_speed}

    G4 P{cut_dwell_time}

    {% if rip_length > 0 %}
        MMU_LOG MSG="Ripping downstream fragment toward nozzle by {rip_length|round(1)}mm with extruder only"
        _MMU_STEP_MOVE MOVE={rip_length} MOTOR=extruder SPEED={rip_speed}

        MMU_LOG MSG="Ripping upstream MMU-side filament away from blade by {rip_length|round(1)}mm with gear only"
        _MMU_STEP_MOVE MOVE=-{rip_length} MOTOR=gear SPEED={rip_speed}
    {% endif %}

    _MMU_CUT_TIP_SAFE_XY_MOVE X={pin_park_x_loc} Y={pin_park_y_loc} SPEED={evacuate_speed}


[gcode_macro _MMU_CUT_TIP_SAFE_XY_MOVE]
description: Safe XY move helper for pre-sensor cutter; skips -999 axes and clamps out-of-range coordinates
gcode:
    {% set x_raw = params.X|default(-999)|float %}
    {% set y_raw = params.Y|default(-999)|float %}
    {% set speed = params.SPEED|default(100)|float %}

    {% set xmin = printer.toolhead.axis_minimum.x|float %}
    {% set xmax = printer.toolhead.axis_maximum.x|float %}
    {% set ymin = printer.toolhead.axis_minimum.y|float %}
    {% set ymax = printer.toolhead.axis_maximum.y|float %}

    {% set do_x = x_raw != -999 %}
    {% set do_y = y_raw != -999 %}

    {% set x = [[x_raw, xmin]|max, xmax]|min if do_x else -999 %}
    {% set y = [[y_raw, ymin]|max, ymax]|min if do_y else -999 %}

    {% if do_x and x != x_raw %}
        MMU_LOG MSG="Warning: requested cutter X {x_raw} is out of range [{xmin}, {xmax}]. Clamped to {x}" ERROR=1
    {% endif %}
    {% if do_y and y != y_raw %}
        MMU_LOG MSG="Warning: requested cutter Y {y_raw} is out of range [{ymin}, {ymax}]. Clamped to {y}" ERROR=1
    {% endif %}

    {% if do_x and do_y %}
        G1 X{x} Y{y} F{speed * 60}
    {% elif do_x %}
        G1 X{x} F{speed * 60}
    {% elif do_y %}
        G1 Y{y} F{speed * 60}
    {% else %}
        MMU_LOG MSG="DEBUG safe XY move skipped because both X and Y are -999"
    {% endif %}


[gcode_macro _MMU_LOAD_SEQUENCE_PRE_SENSOR_CUTTER]
description: Load sequence for a cutter before the extruder entry sensor
gcode:
    {% set filament_pos = params.FILAMENT_POS|default(0)|float %}
    {% set length = params.LENGTH|default(0)|float %}
    {% set full = params.FULL|default(0)|int %}
    {% set home_extruder = params.HOME_EXTRUDER|default(0)|int %}
    {% set skip_extruder = params.SKIP_EXTRUDER|default(0)|int %}
    {% set extruder_only = params.EXTRUDER_ONLY|default(0)|int %}

    {% set custom = printer['gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS'] %}
    {% set state = printer['gcode_macro _MMU_PRE_SENSOR_STATE'] %}
    {% set vars = printer['gcode_macro _MMU_CUT_TIP_VARS'] %}

    {% set debug = custom['debug']|int %}
    {% set has_slug = state.has_parked_slug|int %}
    {% set gear_entry_pos = custom['gear_entry_pos']|float %}
    {% set entry_to_extruder = custom['entry_to_extruder']|float %}
    {% set sensor_clearance = custom['sensor_clearance']|float %}
    {% set slug_load_speed = custom['slug_load_speed']|float %}
    {% set extruder_move_speed = vars['extruder_move_speed']|float %}
    {% set load_to_grip = entry_to_extruder + sensor_clearance %}
    {% set toolhead_fill = gear_entry_pos - sensor_clearance %}

    {% if debug %}
        MMU_LOG MSG="DEBUG load_sequence: FILAMENT_POS={filament_pos}, LENGTH={length}, FULL={full}, HOME_EXTRUDER={home_extruder}, SKIP_EXTRUDER={skip_extruder}, EXTRUDER_ONLY={extruder_only}, has_parked_slug={has_slug}"
    {% endif %}

    {% if extruder_only %}
        _MMU_STEP_LOAD_TOOLHEAD EXTRUDER_ONLY=1

    {% elif not full and filament_pos >= 7 %}
        # Happy Hare calls this load-sequence macro during unload continuation
        # after form_tip. FULL=0 means unload-side bowden/gate retract.
        #
        # After the pre-sensor cut sequence the MMU-side cut tip is parked back
        # at the cutter and the extruder entry sensor must already be clear.
        MMU_LOG MSG="DEBUG load_sequence handling unload-side bowden/gate retract after pre-sensor cut: LENGTH={length}"
        _MMU_STEP_SET_FILAMENT STATE=4
        _MMU_STEP_UNLOAD_BOWDEN FULL=1
        _MMU_STEP_UNLOAD_GATE

    {% else %}
        {% if filament_pos <= 0 %}
            _MMU_STEP_LOAD_GATE
        {% endif %}

        {% if filament_pos < 4 %}
            _MMU_STEP_LOAD_BOWDEN LENGTH={length}
        {% endif %}

        {% if full and not skip_extruder %}
            {% if toolhead_fill <= 0 %}
                {action_raise_error("Invalid pre-sensor cutter geometry. sensor_clearance must stay below gear_entry_pos")}
            {% endif %}
            {% if slug_load_speed <= 0 %}
                {action_raise_error("Invalid pre-sensor cutter geometry. slug_load_speed must be greater than 0")}
            {% endif %}

            {% if has_slug %}
                MMU_LOG MSG="DEBUG load_sequence: parked slug exists; loading new filament behind it"
            {% else %}
                MMU_LOG MSG="DEBUG load_sequence: no parked slug exists; manually filling empty toolhead path"
            {% endif %}

            {% if filament_pos < 6 and home_extruder %}
                _MMU_STEP_HOME_EXTRUDER
            {% endif %}

            MMU_LOG MSG="DEBUG load_sequence: synchronized advance from entry sensor to {sensor_clearance}mm past extruder gears: {load_to_grip}mm"
            _MMU_STEP_MOVE MOVE={load_to_grip} MOTOR=gear+extruder SPEED={slug_load_speed}
            _MMU_STEP_SET_FILAMENT STATE=7

            MMU_LOG MSG="DEBUG load_sequence: filling remaining toolhead/nozzle path: {toolhead_fill}mm with synchronized gear+extruder at {slug_load_speed}mm/s"
            _MMU_STEP_MOVE MOVE={toolhead_fill} MOTOR=gear+extruder SPEED={slug_load_speed}
            _MMU_STEP_SET_FILAMENT STATE=10

            SET_GCODE_VARIABLE MACRO=_MMU_PRE_SENSOR_STATE VARIABLE=has_parked_slug VALUE=0
        {% endif %}
    {% endif %}


[gcode_macro _MMU_UNLOAD_SEQUENCE_PRE_SENSOR_CUTTER]
description: Unload sequence for a cutter before the extruder entry sensor
gcode:
    {% set filament_pos = params.FILAMENT_POS|default(0)|float %}
    {% set length = params.LENGTH|default(0)|float %}
    {% set extruder_only = params.EXTRUDER_ONLY|default(0)|int %}
    {% set park_pos = params.PARK_POS|default(0)|float %}
    {% set custom = printer['gcode_macro _MMU_CUT_TIP_PRE_SENSOR_VARS'] %}
    {% set debug = custom['debug']|int %}

    {% if debug %}
        MMU_LOG MSG="DEBUG unload_sequence: FILAMENT_POS={filament_pos}, LENGTH={length}, EXTRUDER_ONLY={extruder_only}, PARK_POS={park_pos}"
    {% endif %}

    {% if extruder_only %}
        {% if filament_pos >= 7 %}
            {% if debug %}
                MMU_LOG MSG="DEBUG unload_sequence: extruder-only unload leaves parked slug state unchanged"
            {% endif %}
            _MMU_STEP_UNLOAD_TOOLHEAD EXTRUDER_ONLY=1 PARK_POS={park_pos}
        {% else %}
            {action_raise_error("Can't unload extruder - already unloaded!")}
        {% endif %}

    {% elif filament_pos == 0 %}
        {action_raise_error("Can't unload - already unloaded!")}

    {% else %}
        {% if filament_pos >= 7 %}
            _MMU_STEP_UNLOAD_TOOLHEAD PARK_POS={park_pos}
        {% endif %}

        {% if filament_pos >= 4 %}
            _MMU_STEP_UNLOAD_BOWDEN FULL=1
            _MMU_STEP_UNLOAD_GATE

        {% elif filament_pos >= 2 %}
            _MMU_STEP_UNLOAD_GATE FULL=1
        {% endif %}
    {% endif %}
